min_version = "2026.4.18"

[settings]
quiet = true
task_output = "interleave"
experimental = true
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
jq = "latest"
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
bun = "1.3.12"
"github:KnickKnackLabs/himalaya" = "1.2.0-kkl.3"
gum = "0.17.0"
"shiv:codebase" = "0.4"
"shiv:readme" = "0.3"

[_.codebase]
name = "emails"
lint = ["@all"]

[_.codebase.scope]
gum-table = ".mise/tasks"
