[settings]
quiet = true
task_output = "interleave"
experimental = true

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
jq = "latest"
bats = "1.13.0"
bun = "1.3.12"
"github:pimalaya/himalaya" = "1.2.0"
gum = "0.17.0"
"shiv:codebase" = "0.3.0"

[_.codebase]
lint = ["mise-settings", "gum-table", "or-true"]

[_.codebase.scope]
gum-table = ".mise/tasks"
