name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Run BATS tests
        run: mise run test

      - name: Run integration tests
        run: mise run test-integration

      - name: Run component tests
        run: bun test src/

      - name: Check README.md is up to date
        uses: KnickKnackLabs/readme@v0.3.0
        with:
          check: true
